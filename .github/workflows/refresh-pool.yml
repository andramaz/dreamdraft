# Refresh the player pool from EA, weekly and unattended.
#
# EA's ratings endpoint takes no version parameter: it serves whichever game
# is current. The day FC28 ships, this same url starts returning FC28, and a
# refresh that trusted it would write a new game over FC27 under FC27's own
# label — which is how FC26 once got into this database.
#
# Asking a person to approve every run does not fix that. Weekly approvals for
# a refresh that has never once been wrong teach you to click yes without
# reading, and the one week it matters you click yes as well. So the run is
# automatic and `check:shift` guards it instead: it compares the incoming pool
# with what is stored and stops only when the difference is too large to be a
# ratings update. A season's refresh sails through; a change of game does not.
#
# Setup, once: Settings > Secrets and variables > Actions, add DATABASE_URL
# (Neon's pooled connection string). DIRECT_URL is optional.
#
# There is deliberately no `pull_request` trigger: on a public repository that
# is what keeps the secret out of reach of a workflow anybody can propose.

name: Refresh player pool

on:
  schedule:
    # Mondays, 04:00 UTC. EA refreshes base ratings a handful of times a
    # season, so weekly is generous.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Game version to scrape'
        default: 'FC27'
        required: false
      force:
        description: 'Load even if the pool looks like a different game'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    name: Scrape, check, load
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      VERSION: ${{ inputs.version || 'FC27' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape EA
        run: node scripts/scrape-ea.mjs --version "$VERSION" | tee scrape.log

      - name: Build the pool
        run: node scripts/build-pool.mjs --version "$VERSION" | tee -a scrape.log

      # The gate. Exits non-zero when the pool does not look like the same
      # game, which fails the run before anything is written.
      - name: Is this still the same game?
        run: |
          npm run check:shift -w @dreamdraft/backend -- \
            --version "$VERSION" ${{ inputs.force && '--force' || '' }} \
            | tee -a scrape.log

      - name: Apply migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Seed
        working-directory: apps/backend
        run: npm run seed

      # Whether it loaded or was turned away, the numbers go on the run's
      # summary page — that is where you look when the weekly mail says the
      # job failed.
      - name: Report
        if: always()
        run: |
          {
            echo "## $VERSION"
            echo
            echo '```'
            sed -n '/--- what came back ---/,$p' scrape.log || cat scrape.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
